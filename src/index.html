<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue Deck</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#f3f2ef; --card:#ffffff; --text:#1f2328; --muted:#6b6f76; --border:#e2e0db;
  --accent:#3b6fd8; --hover:#e7e5df; --track:#dedcd6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#17181b; --panel:#1f2024; --card:#232428; --text:#e6e6e3; --muted:#9a9ca3; --border:#34363b; --accent:#7aa2f7; --hover:#2e3035; --track:#3a3c42; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#17181b; --panel:#1f2024; --card:#232428; --text:#e6e6e3; --muted:#9a9ca3; --border:#34363b; --accent:#7aa2f7; --hover:#2e3035; --track:#3a3c42; color-scheme:dark; }
/* Theme colors (muted, like Markpad's): light and dark of each */
:root[data-palette="red"]{--bg:#fbf8f7;--panel:#f4edeb;--card:#fffdfc;--text:#2a2020;--muted:#76696a;--border:#e6d9d6;--accent:#a4463f;--hover:#ebdfdb;--track:#e0d2ce}
@media (prefers-color-scheme:dark){:root[data-palette="red"]:not([data-theme="light"]){--bg:#1a1515;--panel:#221c1c;--card:#272020;--text:#ece2e1;--muted:#a69796;--border:#3d3131;--accent:#d98a83;--hover:#342a2a;--track:#463838}}
:root[data-palette="red"][data-theme="dark"]{--bg:#1a1515;--panel:#221c1c;--card:#272020;--text:#ece2e1;--muted:#a69796;--border:#3d3131;--accent:#d98a83;--hover:#342a2a;--track:#463838}
:root[data-palette="blue"]{--bg:#f7f9fb;--panel:#edf1f5;--card:#fdfeff;--text:#1d2430;--muted:#66707d;--border:#d9e0e8;--accent:#3d6a9e;--hover:#e0e7ee;--track:#d3dbe4}
@media (prefers-color-scheme:dark){:root[data-palette="blue"]:not([data-theme="light"]){--bg:#14181d;--panel:#1a1f26;--card:#1e232b;--text:#e2e7ee;--muted:#939dab;--border:#303844;--accent:#86a9d3;--hover:#29303b;--track:#36404d}}
:root[data-palette="blue"][data-theme="dark"]{--bg:#14181d;--panel:#1a1f26;--card:#1e232b;--text:#e2e7ee;--muted:#939dab;--border:#303844;--accent:#86a9d3;--hover:#29303b;--track:#36404d}
:root[data-palette="green"]{--bg:#f8faf7;--panel:#eef2ec;--card:#fdfefc;--text:#1f271f;--muted:#69736a;--border:#dbe2d8;--accent:#4a7a51;--hover:#e1e8dd;--track:#d4dccf}
@media (prefers-color-scheme:dark){:root[data-palette="green"]:not([data-theme="light"]){--bg:#151915;--panel:#1b201b;--card:#1f251f;--text:#e3eae2;--muted:#95a194;--border:#313a31;--accent:#8dba91;--hover:#2b322b;--track:#384238}}
:root[data-palette="green"][data-theme="dark"]{--bg:#151915;--panel:#1b201b;--card:#1f251f;--text:#e3eae2;--muted:#95a194;--border:#313a31;--accent:#8dba91;--hover:#2b322b;--track:#384238}
:root[data-palette="yellow"]{--bg:#fbf9f3;--panel:#f4f0e4;--card:#fffdf8;--text:#2a261b;--muted:#756f60;--border:#e6dfcc;--accent:#93700f;--hover:#ebe5d3;--track:#e0d8c2}
@media (prefers-color-scheme:dark){:root[data-palette="yellow"]:not([data-theme="light"]){--bg:#1a1812;--panel:#211f17;--card:#25221a;--text:#ece7da;--muted:#a39d8c;--border:#3a3527;--accent:#d4ae4f;--hover:#312d23;--track:#433d2d}}
:root[data-palette="yellow"][data-theme="dark"]{--bg:#1a1812;--panel:#211f17;--card:#25221a;--text:#ece7da;--muted:#a39d8c;--border:#3a3527;--accent:#d4ae4f;--hover:#312d23;--track:#433d2d}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:6px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--panel);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;margin-right:auto}
.brand svg{width:22px;height:22px}
.hb{height:32px;min-width:32px;padding:0 9px;display:inline-flex;align-items:center;gap:6px}
.hb:hover{background:var(--hover)}
.hb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.home{display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;height:32px;border:1px solid var(--border);border-radius:16px;margin-right:4px}
main{flex:1;overflow:auto;padding:16px}
h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px 10px}
.section{position:relative}
.section + .section{margin-top:26px}
h2{cursor:grab;display:inline-block;padding:2px 6px;margin-left:-4px;border-radius:5px}
h2:hover{background:var(--hover);color:var(--text)}
.section.dragging{background:var(--bg);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-items:start}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px 10px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--accent)}
.card.open{grid-column:1/-1;cursor:default;padding-bottom:14px;box-shadow:0 6px 22px rgba(0,0,0,.12)}
.card.open:hover{border-color:var(--border)}
.dragging:not(body){z-index:20;position:relative;transition:none!important;box-shadow:0 14px 34px rgba(0,0,0,.35);border-color:var(--accent);cursor:grabbing;opacity:.95}
body.dragging,body.dragging *{cursor:grabbing!important}
.light.dragging{background:var(--card);border-radius:8px}
.scene.dragging{box-shadow:0 8px 20px rgba(0,0,0,.4)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:100%;max-height:110px;background:var(--glow,transparent);opacity:.25;pointer-events:none;transition:background .3s;-webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
.card.off::before{opacity:0}
.top{display:flex;align-items:center;gap:10px;position:relative}
.top .name{font-weight:620;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.chev{display:inline-block;width:14px;color:var(--muted);font-size:11px}
.top .sub{padding-left:14px}
.top .sub{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.dots{width:30px;height:30px;color:var(--muted);flex:none;font-size:18px;line-height:1}
.dots:hover{background:var(--hover);color:var(--text)}
/* switch */
.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--track);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:21px}
/* brightness */
.bri{appearance:none;-webkit-appearance:none;width:100%;height:26px;margin:10px 0 2px;background:none;cursor:pointer;position:relative}
.bri::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--fill,var(--accent)) var(--p,0%),var(--track) var(--p,0%))}
.bri::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.bri:disabled{opacity:.4;cursor:default}
.bri.small{height:20px;margin:0}
.bri.small::-webkit-slider-runnable-track{height:6px}
.bri.small::-webkit-slider-thumb{width:16px;height:16px;margin-top:-5px}
/* scenes */
.scenes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.scene{position:relative;height:30px;padding:0 11px;border-radius:15px;color:#fff;font-size:12.5px;font-weight:560;text-shadow:0 1px 2px rgba(0,0,0,.55);background:var(--g);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scene:hover{filter:brightness(1.08)}
.scene.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.more{margin-top:10px;font-size:12.5px;color:var(--muted);padding:3px 6px;margin-left:-6px}
.more:hover{color:var(--text);background:var(--hover)}
.lights{margin-top:6px;display:grid;gap:4px}
.light{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(70px,120px) 42px 26px;align-items:center;gap:8px;padding:3px 0}
.light .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;cursor:context-menu}
.cdot{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:var(--c,var(--track));padding:0}
.cdot.none{cursor:default}
.light .dots{width:26px;height:26px;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.6}
/* menus, dialogs, toast */
.menu{position:fixed;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:5px;min-width:210px}
.menu button{display:flex;width:100%;text-align:left;padding:7px 10px;align-items:center;gap:8px}
.menu button:hover{background:var(--hover)}
.menu .sep{height:1px;background:var(--border);margin:4px 2px}
.menu .ver{font-size:11.5px;color:var(--muted);padding:5px 10px 3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal[hidden],[hidden]{display:none!important}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.box h3{margin:0 0 12px;font-size:16px}
.box .sub{font-size:12px;color:var(--muted);margin:14px 0 6px}
.box .sub:first-child{margin-top:0}
.box p{margin:6px 0;color:var(--muted);line-height:1.5}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{height:34px;padding:0 14px;border:1px solid var(--border);background:var(--panel)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.field{display:block;width:100%;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font:inherit;user-select:text}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;text-align:left}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt small{display:block;color:var(--muted);font-size:12px}
.shot{display:flex;gap:14px;align-items:center}
.shot canvas{width:64px;height:64px;flex:none}
.shot .field{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.swatches button{display:flex;align-items:center;gap:8px;border:1px solid var(--border);height:34px;padding:0 8px;font-size:13px}
.swatches button span{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none}
.swatches button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.colorbox{display:grid;gap:10px}
.colorbox input[type=color]{width:100%;height:44px;border:1px solid var(--border);border-radius:8px;background:none;padding:2px;cursor:pointer}
.ct{appearance:none;-webkit-appearance:none;width:100%;height:22px;border-radius:11px;background:linear-gradient(90deg,#c9dcff,#fff4e8,#ffb46b);cursor:pointer}
.ct::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.18s;z-index:90;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
.setup{max-width:460px;margin:40px auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.setup h1{font-size:19px;margin:0 0 6px}
.setup .row{display:flex;gap:8px;margin-top:12px}
.setup .row .field{flex:1}
.found{display:grid;gap:6px;margin-top:10px}
@media (max-width:520px){ main{padding:10px} .grid{grid-template-columns:1fr} .home .lbl{display:none} }
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6b13b"/><stop offset=".5" stop-color="#e2557c"/><stop offset="1" stop-color="#5b6cf0"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg)"/><path d="M16 7a6.5 6.5 0 0 0-3.8 11.8c.6.5 1 1.2 1 2V22h5.6v-1.2c0-.8.4-1.5 1-2A6.5 6.5 0 0 0 16 7zM13.4 25h5.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Hue Deck</div>
  <div class="home" id="homeBox" hidden title="Every light in the home"><span class="lbl">All lights</span><input type="checkbox" class="sw" id="homeSw" aria-label="All lights"><button class="dots" id="homeDots" title="Make a shortcut" aria-label="More">⋯</button></div>
  <button class="hb" id="bTheme" title="Light/dark (hold for theme colors)" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="hb" id="bMenu" title="More" aria-label="More"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
</header>
<main id="main"><div class="empty">Connecting to your Hue Bridge…</div></main>
<div class="modal" id="dlg" hidden><div class="box"><h3 id="dlgTitle"></h3><div id="dlgBody"></div><div class="btns" id="dlgBtns"></div></div></div>
<div id="toast"></div>
<script>/*APP*/</script>
</body>
</html>
