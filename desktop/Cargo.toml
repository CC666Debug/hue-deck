[package]
name = "hue-deck"
version = "1.1.0"
description = "Hue Deck: Philips Hue lights, scenes and desktop shortcuts"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
# the bridge answers on HTTPS with its own (self-signed) certificate, so the app checks the bridge by its address instead
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

# small and fast: the whole app should stay a few MB
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
